[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-first-financial-agent"
version = "0.1.0"
description = "Hackathon scaffold: local-first personal financial agent (ledger, embeddings, SLM; Nosana overflow; Arweave provenance stubs)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "ennydev-2026" }]
keywords = [
  "local-first",
  "agentic-ai",
  "decentralize-ai",
  "personal-finance",
  "hackathon",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
lffa = "lffa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lffa"]

[tool.hatch.build.targets.wheel.sources]
"src/lffa" = "lffa"

[tool.hatch.build.targets.sdist]
include = ["src/lffa", "README.md", "LICENSE"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
